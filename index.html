.badge::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--bc); }

.src { font-size: 12.5px; color: var(--cp-text-soft); margin-top: 18px; }

/* ---------- Home ---------- */
.home .wrap { max-width: 900px; }
.hero { font-size: clamp(64px, 10.5vw, 168px); line-height: .86; letter-spacing: -.055em; font-weight: 800; margin: 18px 0 22px; }
.hero .yr { background: linear-gradient(90deg, var(--ms-red), var(--ms-yellow), var(--ms-green), var(--ms-blue), var(--ms-red)); background-size: 200% 100%;
  -webkit-background-clip: text; background-clip: text; color: transparent; animation: flow 6s linear infinite; }

.cta { display: flex; flex-wrap: wrap; gap: 12px; margin-bottom: 40px; }
.tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 12px; }

.tile .td { display: block; font-size: 13px; color: var(--cp-text-muted); line-height: 1.45; }

.legend { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-top: 26px; font-size: 13px; color: var(--cp-text-muted); }

/* ---------- Visuals ---------- */
.visual { margin: 0 0 8px; padding: 22px; border-radius: 16px; border: 1px solid var(--cp-border); background: var(--cp-panel); backdrop-filter: blur(12px); position: relative; overflow: hidden; }

.flow { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; position: relative; }

.chips { display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0; }

.bars { display: grid; gap: 14px; }

.bar-t { height: 16px; border-radius: 8px; background: var(--cp-surface-soft); overflow: hidden; border: 1px solid var(--cp-border); }
.bar-f { height: 100%; width: 0; border-radius: 8px; background: linear-gradient(90deg, var(--fc), color-mix(in srgb, var(--fc) 60%, white)); transition: width 1.6s var(--ease) .4s; }
.visual.in .bar-f { width: var(--w); }

.ln.hl { background: color-mix(in srgb, var(--pc) 35%, transparent); border-color: transparent; animation: pulseW 3s ease-in-out infinite; }
@keyframes pulseW { 50% { width: 60%; } }
.auto { position: relative; width: 120px; height: 46px; border-radius: 999px; display: grid; place-items: center; font-weight: 800; font-size: 13px; letter-spacing: .1em;
  background: conic-gradient(from var(--ang, 0deg), var(--ms-red), var(--ms-green), var(--ms-blue), var(--ms-yellow), var(--ms-red)); padding: 2px; animation: spin 4s linear infinite; }

.q b { display: block; font-size: 17px; letter-spacing: -.01em; } .q small { font-size: 12px; color: var(--cp-text-muted); line-height: 1.4; display: block; margin-top: 4px; }
.loop { position: relative; width: 250px; height: 250px; margin: auto; }
.loop .ring { position: absolute; inset: 34px; border-radius: 50%; border: 3px dashed var(--cp-border-strong); animation: rot 24s linear infinite; }
.loop .core { position: absolute; inset: 82px; border-radius: 50%; display: grid; place-items: center; text-align: center; font-size: 12px; font-weight: 800; line-height: 1.2;
  background: radial-gradient(circle, color-mix(in srgb, var(--ms-red) 30%, var(--cp-surface)), var(--cp-surface)); border: 1px solid var(--cp-border); }
.loop .st { position: absolute; left: 50%; top: 50%; width: 74px; margin: -13px 0 0 -37px; text-align: center; font-size: 11px; font-weight: 700; padding: 5px 0; border-radius: 999px;
  background: var(--cp-surface); border: 1px solid var(--lc); transform: rotate(calc(var(--k) * 60deg)) translateY(-100px) rotate(calc(var(--k) * -60deg)); animation: glow 6s infinite; animation-delay: calc(var(--k) * 1s); }
@keyframes glow { 0%, 20% { background: color-mix(in srgb, var(--lc) 35%, var(--cp-surface)); } 30%, 100% { background: var(--cp-surface); } }
@keyframes rot { to { transform: rotate(360deg); } }
.iqcol ul { list-style: none; margin: 8px 0 0; padding: 0; display: grid; gap: 8px; }
.iqcol li { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; font-size: 13.5px; line-height: 1.45; color: var(--cp-text-muted); padding-top: 8px; border-top: 1px dashed var(--cp-border); }
.iqcol li:first-child { border-top: 0; padding-top: 0; }
/* gauge (agent 365) */
.risk { display: grid; grid-template-columns: 1fr 230px; gap: 22px; align-items: center; }
.sigs { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.sig { padding: 10px; border-radius: 10px; border: 1px solid var(--cp-border); background: var(--cp-surface); font-size: 13px; font-weight: 700; display: flex; align-items: center; gap: 8px; position: relative; overflow: hidden; }
.sig i { width: 8px; height: 8px; border-radius: 50%; background: var(--ms-blue); animation: ping 2s infinite; animation-delay: calc(var(--k) * .3s); }
@keyframes ping { 0% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--ms-blue) 60%, transparent); } 100% { box-shadow: 0 0 0 10px transparent; } }
.fuse { margin-top: 10px; text-align: center; font-size: 12px; color: var(--cp-text-muted); font-family: var(--mono); letter-spacing: .1em; }
.fuse b { color: var(--cp-text); }
.gauge svg { width: 100%; height: auto; overflow: visible; }
.gauge .needle { transform-origin: 110px 110px; transform-box: view-box; animation: needle 5s ease-in-out infinite; }
@keyframes needle { 0% { transform: rotate(-62deg); } 35% { transform: rotate(8deg); } 55% { transform: rotate(-20deg); } 75% { transform: rotate(48deg); } 100% { transform: rotate(-62deg); } }
.gauge text { font-family: var(--font); font-size: 11px; font-weight: 700; fill: var(--cp-text-muted); }
/* layers (entra) */
.layer { border-radius: 14px; padding: 12px 12px 12px; border: 1.5px solid color-mix(in srgb, var(--ms-yellow) 55%, var(--cp-border)); background: color-mix(in srgb, var(--ms-yellow) 6%, transparent); position: relative; }
.layer > span { display: block; font-size: 12px; font-family: var(--mono); letter-spacing: .1em; text-transform: uppercase; font-weight: 700; color: var(--cp-text-muted); margin-bottom: 10px; }
.layer.core { text-align: center; padding: 18px; background: var(--ms-yellow); color: color-mix(in srgb, var(--ms-yellow) 10%, black); border: 0; animation: corePulse 2.4s ease-in-out infinite; }
.layer.core b { font-size: 18px; letter-spacing: -.01em; } .layer.core small { display: block; font-size: 12px; margin-top: 2px; }
@keyframes corePulse { 50% { box-shadow: 0 0 0 8px color-mix(in srgb, var(--ms-yellow) 25%, transparent), 0 0 40px color-mix(in srgb, var(--ms-yellow) 50%, transparent); } }
/* teams (perception) */
.teams { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.team { border-radius: 14px; padding: 14px; background: color-mix(in srgb, var(--tc) 10%, var(--cp-surface)); border: 1px solid color-mix(in srgb, var(--tc) 50%, transparent); }
.team h5 { margin: 0 0 6px; font-size: 16px; display: flex; align-items: center; gap: 8px; } .team h5 i { width: 12px; height: 12px; border-radius: 3px; background: var(--tc); }
.team p { margin: 0; font-size: 13px; line-height: 1.5; color: var(--cp-text-muted); }
.pbar { margin-top: 10px; border-radius: 12px; padding: 12px 16px; font-weight: 800; letter-spacing: .02em; display: flex; justify-content: space-between; align-items: center; gap: 10px;
  background: linear-gradient(90deg, var(--ms-red), var(--ms-blue), var(--ms-green)); background-size: 200% 100%; animation: flow 5s linear infinite; color: var(--ms-on-brand); }
.pbar small { font-weight: 600; opacity: .9; }
.finale { margin-top: 44px; padding: 30px; border-radius: 16px; text-align: center; position: relative; overflow: hidden; border: 1px solid var(--cp-border); background: var(--cp-panel); }
.finale::before { content: ""; position: absolute; inset: 0 0 auto; height: 5px; background: linear-gradient(90deg, var(--ms-red) 25%, var(--ms-green) 0 50%, var(--ms-blue) 0 75%, var(--ms-yellow) 0); }
.finale h3 { font-size: clamp(26px, 3vw, 38px); letter-spacing: -.03em; margin: 8px 0 8px; }
.finale p { color: var(--cp-text-muted); margin: 0 auto 20px; max-width: 520px; line-height: 1.55; }
.finale .cta { justify-content: center; margin: 0; }
/* "What it means for you" callout */
.you { margin: 22px 0 6px; padding: 18px 20px 16px; border-radius: 16px; position: relative; overflow: hidden;
  background: linear-gradient(120deg, color-mix(in srgb, var(--chap) 14%, var(--cp-surface)), var(--cp-surface) 70%); border: 1px solid color-mix(in srgb, var(--chap) 40%, var(--cp-border)); }
.you::before { content: ""; position: absolute; inset: 0 auto 0 0; width: 5px; background: var(--chap); }
.you ul { list-style: none; margin: 8px 0 0; padding: 0; display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px 18px; }
.you li { display: flex; gap: 10px; align-items: flex-start; font-size: 14.5px; line-height: 1.45; color: var(--cp-text); }
.you li::before { content: "✓"; flex: none; display: grid; place-items: center; width: 22px; height: 22px; border-radius: 50%; font-size: 12px; font-weight: 800;
  background: var(--chap); color: color-mix(in srgb, var(--chap) 10%, black); margin-top: 1px; }
.prompt { display: block; margin-top: 8px; padding: 9px 12px; border-radius: 10px; font-size: 13.5px; line-height: 1.4; font-style: italic;
  background: color-mix(in srgb, var(--chap) 10%, transparent); border: 1px solid color-mix(in srgb, var(--chap) 35%, transparent); }
/* pillars (overview) */
.pillars { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; align-items: end; }
.pil { display: flex; flex-direction: column; gap: 8px; }
.pil-cap { border-radius: 12px 12px 4px 4px; padding: 12px 14px; background: var(--pc); color: color-mix(in srgb, var(--pc) 10%, black); }
.pil-cap b { display: block; font-size: 18px; letter-spacing: -.01em; } .pil-cap small { display: block; font-size: 12px; font-weight: 600; opacity: .85; margin-top: 2px; }
.pil-col { display: grid; gap: 6px; padding: 10px; border-radius: 4px; min-height: 150px; align-content: start;
  background: linear-gradient(180deg, color-mix(in srgb, var(--pc) 16%, var(--cp-surface)), color-mix(in srgb, var(--pc) 4%, var(--cp-surface)));
  border: 1px solid color-mix(in srgb, var(--pc) 40%, transparent); transform: scaleY(0); transform-origin: bottom; transition: transform 1.1s var(--ease); transition-delay: calc(.3s + var(--k) * .18s); }
.visual.in .pil-col { transform: scaleY(1); }
.pil-it { text-align: left; cursor: pointer; font-size: 13px; font-weight: 600; padding: 8px 10px; border-radius: 8px; border: 1px solid var(--cp-border); background: var(--cp-surface); display: flex; justify-content: space-between; gap: 8px; transition: transform .2s var(--ease), border-color .2s; }
.pil-it::after { content: "→"; color: var(--pc); }
.pil-it:hover { transform: translateX(3px); border-color: var(--pc); }
.found { margin-top: 10px; border-radius: 10px; padding: 12px 16px; display: flex; flex-wrap: wrap; align-items: center; gap: 10px; font-size: 13px; font-weight: 600;
  background: linear-gradient(90deg, color-mix(in srgb, var(--ms-yellow) 30%, var(--cp-surface)), color-mix(in srgb, var(--ms-yellow) 10%, var(--cp-surface))); border: 1px solid color-mix(in srgb, var(--ms-yellow) 55%, transparent); }
.found span { font-family: var(--mono); font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--cp-text-muted); margin-right: auto; }
.found button { padding: 4px 10px; border-radius: 999px; border: 0; cursor: pointer; font: inherit; font-size: 12.5px; background: var(--ms-yellow); color: color-mix(in srgb, var(--ms-yellow) 10%, black); transition: transform .2s; }
.found button:hover, .found button:focus-visible { transform: translateY(-2px); }
/* priorities picker */
.convo { display: grid; grid-template-columns: 270px 1fr; gap: 16px; align-items: start; }
.cv-g { font-family: var(--mono); font-size: 11px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; color: var(--cp-text-soft); margin: 2px 0 6px; display: flex; align-items: center; gap: 8px; }
.cv-g i { width: 10px; height: 10px; border-radius: 3px; background: var(--gc); }
.cv-g + .cv-btn { margin-top: 0; }
.cv-btn { display: flex; justify-content: space-between; align-items: center; gap: 8px; width: 100%; text-align: left; padding: 8px 10px; margin-bottom: 6px; border-radius: 10px; cursor: pointer;
  border: 1px solid var(--cp-border); background: var(--cp-surface); font-size: 13px; font-weight: 600; line-height: 1.3; transition: border-color .2s, background .2s, transform .2s var(--ease); }
.cv-btn:hover { transform: translateX(3px); border-color: var(--gc); }
.cv-btn em { font-style: normal; flex: none; font-family: var(--mono); font-size: 11px; font-weight: 700; min-width: 24px; text-align: center; padding: 2px 6px; border-radius: 999px; background: color-mix(in srgb, var(--gc) 20%, transparent); }
.cv-btn.on { border-color: var(--gc); background: color-mix(in srgb, var(--gc) 16%, var(--cp-surface)); box-shadow: inset 4px 0 0 var(--gc); }
.cv-list .cv-g:not(:first-child) { margin-top: 12px; }
.cv-panel { border-radius: 14px; padding: 18px; background: var(--cp-surface); border: 1px solid var(--cp-border); min-height: 100%; position: relative; overflow: hidden; }
.cv-panel::before { content: ""; position: absolute; inset: 0 0 auto; height: 4px; background: var(--gc); }
.cv-panel h4 { margin: 4px 0 4px; font-size: 22px; letter-spacing: -.02em; line-height: 1.2; }
.cv-panel .cv-sub { font-size: 13px; color: var(--cp-text-muted); margin-bottom: 14px; }
.cv-chips { display: flex; flex-wrap: wrap; gap: 8px; }
.cv-chip { cursor: pointer; font-size: 13px; padding: 7px 12px; display: inline-flex; align-items: center; gap: 6px; animation: chipIn .5s var(--ease) both; animation-delay: calc(var(--k) * 45ms); transition: transform .2s var(--ease), background .2s; }
.cv-chip:hover { transform: translateY(-2px); background: color-mix(in srgb, var(--chap) 22%, transparent); }
.cv-chip i { font-style: normal; font-family: var(--mono); font-size: 10.5px; opacity: .7; }
@keyframes chipIn { from { opacity: 0; transform: translateY(8px) scale(.94); } }
.cv-bars { margin-top: 18px; display: grid; grid-template-columns: 1fr 1fr; gap: 10px 20px; }
/* timeline (activate) */
.tl { position: relative; display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; padding-top: 6px; }
.tl::before { content: ""; position: absolute; left: 4%; right: 4%; top: 27px; height: 4px; border-radius: 2px; background: linear-gradient(90deg, var(--ms-red), var(--ms-green), var(--ms-blue), var(--ms-yellow));
  transform: scaleX(0); transform-origin: left; transition: transform 1.8s var(--ease) .3s; }
.visual.in .tl::before { transform: scaleX(1); }
.tl-s { text-align: center; position: relative; }
.tl-s .tl-d { width: 46px; height: 46px; margin: 0 auto 10px; border-radius: 50%; display: grid; place-items: center; background: var(--cp-surface); border: 3px solid var(--tc); font-weight: 800; font-family: var(--mono); font-size: 13px;
  transform: scale(0); transition: transform .6s var(--ease); transition-delay: calc(.5s + var(--k) * .3s); position: relative; z-index: 1; }
.visual.in .tl-s .tl-d { transform: scale(1); }
.tl-s .tl-d::after { content: ""; position: absolute; inset: -3px; border-radius: 50%; border: 2px solid var(--tc); animation: tlPing 2.6s infinite; animation-delay: calc(var(--k) * .5s); }
@keyframes tlPing { 0% { opacity: .8; transform: scale(1); } 100% { opacity: 0; transform: scale(1.6); } }
.tl-s time { display: block; font-family: var(--mono); font-size: 11.5px; font-weight: 700; letter-spacing: .06em; color: var(--cp-text-soft); }
.tl-s b { display: block; font-size: 14px; margin: 3px 0 2px; } .tl-s small { display: block; font-size: 12px; line-height: 1.4; color: var(--cp-text-muted); }
.step-n { font-family: var(--mono); font-size: 12px; font-weight: 800; color: var(--chap-ink); margin-right: 6px; }
/* road to GA */
.road { display: grid; grid-template-columns: 1.15fr 1.05fr .9fr 1.1fr; gap: 12px; position: relative; }
.lane { position: relative; padding: 14px 12px 12px; border-radius: 14px; border: 1px solid color-mix(in srgb, var(--lc) 40%, var(--cp-border));
  background: linear-gradient(165deg, color-mix(in srgb, var(--lc) 14%, transparent), transparent 70%);
  opacity: 0; translate: 0 18px; transition: opacity .6s var(--ease), translate .6s var(--ease); transition-delay: calc(.4s + var(--k) * .18s); }
.visual.in .lane { opacity: 1; translate: 0 0; }
.lane:not(:last-child)::after { content: "→"; position: absolute; right: -13px; top: 18px; z-index: 2; width: 14px; text-align: center; font-weight: 800; color: var(--cp-text-soft); }
.ln-l { font-family: var(--mono); font-size: 11px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; color: color-mix(in srgb, var(--lc) 70%, var(--cp-text)); }
.lane h5 { margin: 2px 0 0; font-size: 16px; font-weight: 700; }
.lane ul { list-style: none; margin: 10px 0 0; padding: 0; display: grid; gap: 7px; }
.rd-i { all: unset; box-sizing: border-box; width: 100%; cursor: pointer; display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; padding: 8px 10px; border-radius: 10px;
  background: var(--cp-panel); border: 1px solid var(--cp-border); transition: border-color .25s, transform .25s var(--ease); }
.rd-i:hover, .rd-i:focus-visible { border-color: var(--lc); transform: translateX(3px); }
.rd-i:focus-visible { outline: 2px solid var(--lc); outline-offset: 2px; }
.rd-i b { display: block; font-size: 13px; line-height: 1.3; } .rd-i small { display: block; font-size: 11.5px; line-height: 1.35; color: var(--cp-text-muted); margin-top: 2px; }
.rd-t { flex: none; font-style: normal; font-family: var(--mono); font-size: 10px; font-weight: 800; letter-spacing: .05em; padding: 2px 6px; border-radius: 6px; white-space: nowrap; --tc2: var(--ms-gray);
  color: color-mix(in srgb, var(--tc2) 70%, var(--cp-text)); background: color-mix(in srgb, var(--tc2) 16%, transparent); border: 1px solid color-mix(in srgb, var(--tc2) 40%, transparent); }
.rd-ga { --tc2: var(--ms-green); } .rd-pv { --tc2: var(--ms-blue); } .rd-tbc { --tc2: var(--ms-gray); }
.rd-note { margin: 12px 0 0; font-size: 12.5px; line-height: 1.5; color: var(--cp-text-soft); }
.phases { display: grid; grid-template-columns: 1fr 1.25fr .9fr; gap: 12px; }
.phase { position: relative; padding: 16px 16px 14px; border-radius: 14px; border: 1px solid color-mix(in srgb, var(--pc) 40%, var(--cp-border)); background: linear-gradient(160deg, color-mix(in srgb, var(--pc) 14%, transparent), transparent 70%);
  opacity: 0; translate: 0 14px; transition: opacity .6s var(--ease), translate .6s var(--ease); transition-delay: calc(1.4s + var(--k) * .2s); }
.visual.in .phase { opacity: 1; translate: 0 0; }
.phase:not(:last-child)::after { content: "→"; position: absolute; right: -11px; top: 50%; translate: 0 -50%; font-weight: 800; color: var(--pc); z-index: 1; }
.phase .ph-l { font-family: var(--mono); font-size: 10.5px; font-weight: 800; letter-spacing: .12em; text-transform: uppercase; color: var(--pc); }
.phase h5 { margin: 4px 0 10px; font-size: 15px; }
.ph-steps { display: flex; flex-direction: column; gap: 6px; }
.ph-step { display: flex; align-items: center; gap: 10px; width: 100%; text-align: left; padding: 7px 10px; border-radius: 10px; border: 1px solid var(--cp-border); background: var(--cp-surface); color: inherit; font: inherit; font-size: 13px; cursor: pointer; transition: border-color .2s, transform .2s; }
.ph-step:hover, .ph-step:focus-visible { border-color: var(--pc); transform: translateX(3px); }
.ph-step i { flex: none; width: 24px; height: 24px; border-radius: 50%; display: grid; place-items: center; font-style: normal; font-family: var(--mono); font-size: 11px; font-weight: 800; background: var(--pc); color: #fff; }
.card.rv.in.flash { animation: rvIn .9s var(--ease) forwards, cardFlash 1.8s var(--ease) .2s; }
@keyframes cardFlash { 0%, 100% { box-shadow: none; } 25% { box-shadow: 0 0 0 3px var(--chap), 0 0 36px color-mix(in srgb, var(--chap) 45%, transparent); } }
.mail { display: flex; gap: 12px; align-items: flex-start; }
.mail .env { flex: none; width: 44px; height: 32px; border-radius: 5px; position: relative; background: color-mix(in srgb, var(--chap) 22%, var(--cp-surface)); border: 1.5px solid var(--chap); overflow: hidden; }
.mail .env::before { content: ""; position: absolute; inset: 0; background: var(--chap); clip-path: polygon(0 0, 50% 58%, 100% 0, 100% 9%, 50% 67%, 0 9%); }
.mail .to { display: block; font-family: var(--mono); font-size: 10.5px; font-weight: 800; letter-spacing: .1em; text-transform: uppercase; color: var(--chap-ink); }

/* ---------- Storyline rail ---------- */
.rail { position: fixed; left: 0; right: 0; bottom: 0; height: var(--rail); z-index: 30; display: flex; align-items: stretch; gap: 12px; padding: 10px clamp(12px, 2.4vw, 28px) 8px;
  background: var(--cp-panel-strong); backdrop-filter: blur(16px); border-top: 1px solid var(--cp-border); }
.rail::before { content: ""; position: absolute; left: 0; right: 0; top: -1px; height: 4px;
  background: linear-gradient(90deg, var(--ms-red) 25%, var(--ms-green) 0 50%, var(--ms-blue) 0 75%, var(--ms-yellow) 0); }
.home-btn { align-self: center; display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 10px 14px; border-radius: 12px; cursor: pointer;
  border: 1px solid var(--cp-border); background: var(--cp-surface); font-size: 12px; font-weight: 700; transition: transform .2s var(--ease), border-color .2s, box-shadow .2s; }
.home-btn svg { width: 22px; height: 22px; stroke: var(--ms-brand); }
.home-btn:hover { transform: translateY(-2px); border-color: var(--ms-brand); box-shadow: var(--cp-shadow); }
.home-btn.on { border-color: var(--ms-brand); background: color-mix(in srgb, var(--ms-brand) 10%, var(--cp-surface)); }
.track { position: relative; flex: 1; min-width: 0; }
.track svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
.path-base { fill: none; stroke: var(--cp-border-strong); stroke-width: 2; stroke-dasharray: 2 7; stroke-linecap: round; opacity: .8; }
.path-prog { fill: none; stroke-width: 5; stroke-linecap: round; transition: stroke-dashoffset 1.6s var(--ease); }
.comet { fill: var(--cp-text); }
.comet-glow { opacity: .5; }
.node { position: absolute; width: 0; height: 0; border: 0; padding: 0; background: none; cursor: pointer; }
.node .dot { position: absolute; left: -11px; top: -11px; width: 22px; height: 22px; border-radius: 50%; border: 3px solid var(--chap); background: var(--cp-surface);
  transition: transform .4s var(--ease), background .4s, box-shadow .4s; display: grid; place-items: center; }
.node.visited .dot { background: color-mix(in srgb, var(--chap) 55%, var(--cp-surface)); }
.node.active .dot { background: var(--chap); transform: scale(1.35); animation: nodePulse 1.8s infinite; }
@keyframes nodePulse { 0% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--chap) 55%, transparent); } 100% { box-shadow: 0 0 0 14px transparent; } }
.node:hover .dot { transform: scale(1.3); }
.node.homenode .dot { border: 0; background: none; border-radius: 4px; }
.node.homenode .dot svg { width: 22px; height: 22px; }
.node.homenode.active .dot { background: none; box-shadow: none; animation: none; transform: scale(1.35); }
.node .lbl { position: absolute; top: 20px; left: 0; translate: -50% 0; white-space: nowrap; text-align: center; font-size: 12.5px; font-weight: 600; color: var(--cp-text-muted); transition: color .3s; line-height: 1.2; }
.node .lbl small { display: block; font-family: var(--mono); font-size: 10.5px; color: var(--chap-ink); font-weight: 700; letter-spacing: .06em; }
.node.active .lbl { color: var(--cp-text); font-weight: 800; }
.node:focus-visible .dot, .btn:focus-visible, .tile:focus-visible, .home-btn:focus-visible, .arrow:focus-visible { outline: 3px solid var(--ms-brand); outline-offset: 3px; }
.arrows { display: flex; align-items: center; gap: 8px; }
.arrow { width: 44px; height: 44px; border-radius: 12px; border: 1px solid var(--cp-border); background: var(--cp-surface); cursor: pointer; font-size: 18px; font-weight: 700; transition: transform .2s, border-color .2s, opacity .2s; }
.arrow:hover:not(:disabled) { transform: translateY(-2px); border-color: var(--ms-brand); }
.arrow:disabled { opacity: .35; cursor: default; }
.kbd { font-family: var(--mono); font-size: 10.5px; color: var(--cp-text-soft); text-align: center; margin-top: 4px; }

/* ---------- Intro ---------- */
.intro { position: fixed; inset: 0; z-index: 100; display: grid; place-items: center; background: var(--cp-bg); cursor: pointer; transition: opacity .8s var(--ease), visibility 0s linear .8s; }
.intro.done { opacity: 0; visibility: hidden; }
.intro-in { display: grid; justify-items: center; gap: 22px; }

<script>
(() => {
  const D = window.STORY;
  const N = D.length;
  const BON = 'https://news.microsoft.com/events/ignite/2026/book-of-news/';
  const BADGE = { ga: 'GA', preview: 'Preview', frontier: 'Frontier', pp: 'Private preview', roll: 'Rolling out' };
  const COLVAR = { red: '--ms-red', green: '--ms-green', blue: '--ms-blue', yellow: '--ms-yellow', brand: '--ms-brand' };
  const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const LOGO = '<svg class="mslogo" viewBox="0 0 23 23" aria-hidden="true"><rect class="r" x="1" y="1" width="10" height="10"/><rect class="g" x="12" y="1" width="10" height="10"/><rect class="b" x="1" y="12" width="10" height="10"/><rect class="y" x="12" y="12" width="10" height="10"/></svg>';

  const badge = (b) => {
    if (!b) return '';
    const [k, custom] = b.split(':');
    return `<span class="badge b-${k}">${custom || BADGE[k]}</span>`;
  };
  const GAK = { now: 'ga-now', date: 'ga-date', tbc: 'ga-tbc' };
  const gaChip = (g) => {
    if (!g) return '';
    const [k, txt] = g.split('|');
    const [head, ...rest] = txt.split(' · ');
    return `<div class="ga ${GAK[k]}" title="General availability timing"><i>GA</i><span><b>${head}</b>${rest.length ? ` · ${rest.join(' · ')}` : ''}</span></div>`;
  };
  const SHOTS = window.SHOTS || {};
  const plain = (h) => String(h).replace(/<[^>]+>/g, '').replace(/&amp;/g, '&').trim();
  const CUE = '<span class="shot-cue"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><rect x="1.5" y="2.5" width="13" height="10" rx="1.5"/><circle cx="5.5" cy="6" r="1.2"/><path d="M14.5 10.5 10.5 7l-6 5.5"/></svg>View screenshot</span>';
  const card = (c) => {
    const k = plain(c.t), s = SHOTS[k];
    const shot = s ? ` has-shot" data-shot="${k.replace(/"/g, '&quot;')}" tabindex="0" role="button" aria-haspopup="dialog" aria-label="${k.replace(/"/g, '&quot;')}: view screenshot` : '';
    return `<article class="card rv${c.wide ? ' wide' : ''}${shot}"${c.id ? ` id="${c.id}"` : ''}><div class="card-top"><h4>${c.t}</h4>${badge(c.b)}</div><p>${c.d}</p>${gaChip(c.ga)}${s ? CUE : ''}</article>`;
  };
  const stat = (s) => `<div class="stat rv"><b data-count="${s.n}" data-dec="${s.dec || 0}" data-pre="${s.pre || ''}" data-suf="${s.suf || ''}">${s.pre || ''}0${s.suf || ''}</b><span>${s.l}</span></div>`;
  const idx = (id) => D.findIndex(c => c.id === id);
  const GCOL = { Transform: '--ms-green', Foundations: '--ms-blue' };
  const cvPanel = (cv) => `<div class="cv-panel" style="--gc:var(${GCOL[cv.g]})"><div class="vis-cap" style="margin:0">${cv.g} · ${cv.items.length} announcements</div><h4>${cv.t}</h4>
      <div class="cv-sub">Select an announcement to jump to its chapter.</div>
      <div class="cv-chips">${cv.items.map((it, k) => { const j = idx(it[1]); return `<button class="chip cv-chip c-${D[j].color}" data-go="${j}" style="--k:${k}">${it[0]}<i>→ ${D[j].short}</i></button>`; }).join('')}</div></div>`;

  /* ---------- Visuals ---------- */
  const VIS = {
    flow: () => `<div class="vis-cap">The Azure stack, end to end</div><div class="flow">${[
      ['Silicon', 'Cobalt 200 · MI350P · GB300', '--ms-blue'],
      ['Infrastructure', 'AKS · Agent Grid · Flex nodes', '--ms-brand'],
      ['Platform', 'Foundry on AKS · Sandbox', '--ms-green'],
      ['Operations', 'SRE Agent · Azure Monitor', '--ms-yellow'],
      ['Modernization', 'Catalyst · Windows Server 2028', '--ms-red']
    ].map((s, k) => `<div class="fstep" style="--fc:var(${s[2]});--k:${k}"><div class="dot">0${k + 1}</div><b>${s[0]}</b><small>${s[1]}</small></div>`).join('')}</div>`,

    bars: () => `<div class="feature"><div>
        <span class="badge b-ga">Generally available</span>
        <h3>Microsoft-Decision-1.1</h3>
        <p>Built for the decisions inside agentic systems, with calibrated confidence scores. Based on Gemma 4 26B A4B with multimodal image input. Available in Foundry, OpenRouter and Vercel.</p>
        <div class="chips">${['Routing', 'Classification', 'Prioritization', 'Verification', 'Workflow control'].map(x => `<span class="chip">${x}</span>`).join('')}</div>
        <p style="margin-top:10px">Scores higher than Jev 1.14, Gemini-Decision-1 and GPT-6 Luna (Decisions). Routes Copilot requests between Chat and Cowork, and powers Auto effort in Cowork.</p>
      </div><div>
        <div class="vis-cap">AA Decision Index v2.1</div>
        <div class="bars">
          <div><div class="bar-l"><span>Microsoft-Decision-1</span><span>62</span></div><div class="bar-t"><div class="bar-f" style="--w:${62 / 75 * 100}%;--fc:var(--ms-gray)"></div></div></div>
          <div><div class="bar-l"><span>Microsoft-Decision-1.1</span><span>68</span></div><div class="bar-t"><div class="bar-f" style="--w:${68 / 75 * 100}%;--fc:var(--ms-yellow)"></div></div></div>
        </div>
        <div class="speed"><b>2×+</b> faster than leading competitors</div>
      </div></div>`,

    handoff: () => `<div class="vis-cap">Copilot Home · Auto hands off with full context</div><div class="handoff">
        <div class="pane" style="--pc:var(--ms-blue)"><h5><i></i>Chat</h5><div class="ln" style="width:80%"></div><div class="ln hl" style="width:95%"></div><div class="ln" style="width:60%"></div><div class="ln" style="width:72%"></div></div>
        <div class="auto"><span>AUTO</span></div>
        <div class="pane" style="--pc:var(--ms-green)"><h5><i></i>Cowork</h5><div class="ln hl" style="width:90%"></div><div class="ln" style="width:70%"></div><div class="ln hl" style="width:84%;animation-delay:1.2s"></div><div class="ln" style="width:52%"></div></div>
      </div>`,

    iq: (ch) => `<div class="iqviz"><div><div class="vis-cap">Four sources of context, one IQ</div><div class="quad">${ch.iq.map(q => `<div class="q c-${q.c}"><b>${q.t}</b><small>${q.items.slice(0, 2).map(i => i[0]).join(' · ')}</small></div>`).join('')}</div></div>
      <div class="loop" aria-label="Continuous improvement loop"><div class="ring"></div><div class="core">Continuous<br>improvement</div>${
        [['Evaluate', '--ms-red'], ['Insights', '--ms-yellow'], ['Annotate', '--ms-green'], ['Optimize', '--ms-blue'], ['Train', '--ms-red'], ['Deploy', '--ms-green']]
          .map((s, k) => `<div class="st" style="--k:${k};--lc:var(${s[1]})">${s[0]}</div>`).join('')}</div></div>`,

    risk: () => `<div class="risk"><div><div class="vis-cap">Six runtime signals → one dynamic risk score</div><div class="sigs">${
        ['Identity', 'Access', 'Data', 'Endpoints', 'Cloud', 'Network'].map((s, k) => `<div class="sig" style="--k:${k}"><i></i>${s}</div>`).join('')}</div>
        <div class="fuse">+ <b>posture</b> + <b>blast radius</b> → follows the agent everywhere</div></div>
      <div class="gauge"><svg viewBox="0 0 220 130" role="img" aria-label="Risk gauge: low, medium, high">
        <path d="M30 110 A80 80 0 0 1 70 40.72" fill="none" stroke="var(--ms-green)" stroke-width="16"/>
        <path d="M70 40.72 A80 80 0 0 1 150 40.72" fill="none" stroke="var(--ms-yellow)" stroke-width="16"/>
        <path d="M150 40.72 A80 80 0 0 1 190 110" fill="none" stroke="var(--ms-red)" stroke-width="16"/>
        <g class="needle"><line x1="110" y1="110" x2="110" y2="44" stroke="var(--cp-text)" stroke-width="4" stroke-linecap="round"/></g>
        <circle cx="110" cy="110" r="9" fill="var(--cp-text)"/>
        <text x="22" y="127">LOW</text><text x="92" y="22">MEDIUM</text><text x="178" y="127">HIGH</text>
      </svg></div></div>`,

    layers: () => {
      const L = ['Global Secure Access', 'Tenant governance', 'ID Governance', 'Microsoft Entra ID'];
      let html = `<div class="layer core"><b>Agent ID</b><small>Local agents · Autopilot cloud agents</small></div>`;
      for (let i = L.length - 1; i >= 0; i--) html = `<div class="layer"><span>${L[i]}</span>${html}</div>`;
      return `<div class="vis-cap">Zero Trust layers, from the network edge to the agent</div>${html}`;
    },

    teams: () => `<div class="vis-cap">Agent teams, coordinated by playbooks</div><div class="teams">
        <div class="team" style="--tc:var(--ms-red)"><h5><i></i>Red team</h5><p>Looks for weaknesses first, like the Web App Pen Test Agent.</p></div>
        <div class="team" style="--tc:var(--ms-blue)"><h5><i></i>Blue team</h5><p>Triages, investigates, detects and produces threat intelligence.</p></div>
        <div class="team" style="--tc:var(--ms-green)"><h5><i></i>Green team</h5><p>Prioritizes posture fixes and reduces exposure risk.</p></div>
      </div><div class="pbar"><span>Playbooks orchestrate</span><small>inside Defender SOC workflows</small></div>`,

    pillars: (ch) => `<div class="vis-cap">Three pillars · one foundation</div><div class="pillars">${ch.pillars.map((p, k) =>
        `<div class="pil" style="--pc:var(${COLVAR[p.c]});--k:${k}"><div class="pil-cap"><b>${p.t}</b><small>${p.s}</small></div><div class="pil-col">${

    convos: (ch) => {

        `<button class="cv-btn${k === 0 ? ' on' : ''}" data-conv="${k}" style="--gc:var(${GCOL[g]})" aria-pressed="${k === 0}">${cv.t}<em>${cv.items.length}</em></button>`).join('')}`).join('');
      const freq = {};
      ch.convos.forEach(cv => cv.items.forEach(([n]) => { freq[n] = (freq[n] || 0) + 1; }));
      const top = Object.entries(freq).sort((a, b) => b[1] - a[1]).slice(0, 6);
      const fc = ['--ms-yellow', '--ms-blue', '--ms-brand', '--ms-red', '--ms-green', '--ms-blue'];
      return `<div class="vis-cap">Pick the priority closest to yours</div><div class="convo"><div class="cv-list" role="group" aria-label="Business priorities">${groups}</div><div id="cvSlot">${cvPanel(ch.convos[0])}</div></div>
        <div class="vis-cap" style="margin-top:22px">The announcements that show up most across the ${ch.convos.length} priorities</div><div class="cv-bars">${top.map(([n, v], k) =>
          `<div><div class="bar-l"><span>${n}</span><span>${v} of ${ch.convos.length}</span></div><div class="bar-t"><div class="bar-f" style="--w:${v / ch.convos.length * 100}%;--fc:var(${fc[k]})"></div></div></div>`).join('')}</div>`;

    timeline: (ch) => `<div class="vis-cap">${ch.tlCap || 'Timeline'}</div><div class="tl">${ch.timeline.map((s, k) =>

    edges.forEach((e, i) => { if (e[0] === sel) selEdges.push(i); });
    selEdges.forEach((ei, j) => { hp.set(ep.subarray(ei * 6, ei * 6 + 6), j * 6); });
    hgeo.setDrawRange(0, selEdges.length * 2); hgeo.attributes.position.needsUpdate = true;
    hl.material.color.copy(oc[sel] || C.g);
  };
  select(0);
  addEventListener('story:conv', (e) => select(e.detail.index));
  const ell = new THREE.EllipseCurve(0, 0, 11.2, 7.4, 0, Math.PI * 2).getSpacedPoints(160), elc = [];
  ell.forEach((p, i) => { const c = C.g.clone().lerp(C.b, .5 - .5 * Math.cos(i / 160 * Math.PI * 2)); elc.push(c.r, c.g, c.b); });
  const elg = new THREE.BufferGeometry().setFromPoints(ell); elg.setAttribute('color', new THREE.Float32BufferAttribute(elc, 3));
  const outer = new THREE.Line(elg, new THREE.LineBasicMaterial({ vertexColors: true, transparent: true, opacity: .7 })); net.add(outer);
  net.add(at(sprite(C.brand, 20, DARK ? .28 : .16), 0, 0, -2));
  const P = 110, pulse = makePoints(P, 1.6), pq = [];
  for (let i = 0; i < P; i++) pq.push({ e: (Math.random() * edges.length) | 0, p: Math.random(), sp: rand(.35, .8), dir: Math.random() < .5 });
  net.add(pulse);
  const tv3 = new THREE.Vector3();
  let t0 = -1;
  s.arrive = (d) => { t0 = T + d; };
  s.update = (t, dt) => {
    const k = t0 < 0 ? 1 : clamp((t - t0) / 1.3, 0, 1);
    net.scale.setScalar(Math.max(.05, easeOutBack(k)));
    net.rotation.y = Math.sin(t * .25) * .32; net.rotation.x = Math.sin(t * .19) * .1;
    for (let i = 0; i < P; i++) {
      const q = pq[i]; q.p += dt * q.sp;
      if (q.p >= 1) { q.p = 0; q.e = (selEdges.length && Math.random() < .55) ? pick(selEdges) : (Math.random() * edges.length) | 0; q.dir = Math.random() < .5; }
      const [ok, nd] = edges[q.e], u = q.dir ? q.p : 1 - q.p;
      tv3.lerpVectors(op[ok], nd.p, u); pulse.setP(i, tv3.x, tv3.y, tv3.z); pulse.setC(i, q.dir ? nd.c : oc[ok]);
    }
    pulse.dirty(); pulse.geometry.attributes.aColor.needsUpdate = true;
    orbs.forEach((m, j) => {
      const on = j === sel, target = on ? 1.45 + Math.sin(t * 3) * .08 : 1;
      m.scale.setScalar(m.scale.x + (target - m.scale.x) * .12);
      m.userData.halo.rotation.set(t * .8 + j, t * .6, 0); m.userData.halo.material.opacity = on ? .95 : .35;
    });
    outer.rotation.z = t * .04;
  };
});

/* 10 · ACTIVATE — a rising helix of milestones from launch pad to goal */
station(10, (s, g) => {
  g.scale.setScalar(.85);
  class Helix extends THREE.Curve {
    getPoint(u, tgt = new THREE.Vector3()) { const a = u * Math.PI * 2 * 2.25, r = 5.5 * (1 - u * .55); return tgt.set(Math.cos(a) * r, -7 + u * 14, Math.sin(a) * r); }
  }
  const hc = new Helix(), SEG = 400, RAD = 8, IPS = RAD * 6;
  const tg = new THREE.TubeGeometry(hc, SEG, .24, RAD, false), vc = [], tc3 = new THREE.Color();
  for (let i = 0; i < tg.attributes.position.count; i++) {
    const u = Math.floor(i / (RAD + 1)) / SEG, f = u * 3, a = Math.min(2, f | 0);
    tc3.copy(MS4[a]).lerp(MS4[a + 1], f - a); vc.push(tc3.r, tc3.g, tc3.b);
  }
  tg.setAttribute('color', new THREE.Float32BufferAttribute(vc, 3));
  const tube = new THREE.Mesh(tg, new THREE.MeshBasicMaterial({ vertexColors: true })); g.add(tube);
  g.add(new THREE.Mesh(new THREE.TubeGeometry(hc, 200, .1, 6, false), basic(C.soft, DARK ? .14 : .2)));
  g.add(at(new THREE.Mesh(new THREE.CylinderGeometry(6.2, 6.6, .5, 6), std(C.brand, { emissiveIntensity: DARK ? .3 : .12 })), 0, -7.6, 0));
  const pr = hexRing(7.4, .06, C.brand, .6); pr.rotation.x = Math.PI / 2; pr.position.y = -7.4; g.add(pr);
  const shock = ring(1, .05, C.y, .8); shock.rotation.x = Math.PI / 2; shock.position.y = -7.2; g.add(shock);
  const MU = [...Array(7)].map((_, k) => (k + .5) / 7), ms = MU.map((u, k) => {
    const c = MS4[k % 4], m = new THREE.Group(), p = hc.getPoint(u); m.position.copy(p); m.lookAt(0, p.y, 0);
    m.add(hexRing(.95, .1, c)); m.add(new THREE.Mesh(new THREE.SphereGeometry(.34, 16, 12), std(c, { emissiveIntensity: DARK ? .6 : .3 }))); m.add(sprite(c, 4.5, DARK ? .45 : .25));
    m.scale.setScalar(.001); g.add(m); return m;
  });
  const goal = at(new THREE.Mesh(new THREE.OctahedronGeometry(1.15, 0), std(C.y, { emissiveIntensity: DARK ? .55 : .25, roughness: .2 })), 0, 8.6, 0); g.add(goal);
  const gGlow = at(sprite(C.y, 11, DARK ? .45 : .25), 0, 8.6, 0); g.add(gGlow);
  const TR = 60, trail = makePoints(TR, 2.1), head = sprite(0xffffff, 3.2, .9);
  for (let i = 0; i < TR; i++) trail.setC(i, i < 6 ? new THREE.Color(1, 1, 1) : C.y);
  g.add(trail); g.add(head);
  const NA = 260, amb = makePoints(NA, 1.1), ad = [];
  for (let i = 0; i < NA; i++) { const a = rand(Math.PI * 2), r = rand(2, 9); ad.push([Math.cos(a) * r, Math.sin(a) * r, Math.random(), rand(.04, .1)]); amb.setC(i, pick(MS4)); }
  g.add(amb);
  const tv3 = new THREE.Vector3();
  let t0 = -1;
  s.arrive = (d) => { t0 = T + d; };
  s.update = (t) => {
    const prog = t0 < 0 ? 1 : clamp((t - t0) / 3.2, 0, 1), pe = easeInOutCubic(prog);
    tg.setDrawRange(0, Math.max(1, Math.round(pe * SEG)) * IPS);
    ms.forEach((m, k) => { const q = clamp((pe - MU[k]) * 9, 0, 1); m.scale.setScalar(Math.max(.001, easeOutBack(q))); m.rotation.z = t * .6 + k; });
    const gq = clamp((pe - .96) * 25, 0, 1);
    goal.scale.setScalar(Math.max(.001, easeOutBack(gq))); goal.rotation.set(t * .5, t * .9, 0); gGlow.material.opacity = gq * ((DARK ? .45 : .25) + Math.sin(t * 2.2) * .08);
    const cu = prog < 1 ? pe : (t * .09) % 1;
    for (let i = 0; i < TR; i++) { hc.getPoint(Math.max(0, cu - i * .0035), tv3); trail.setP(i, tv3.x, tv3.y, tv3.z); }
    trail.dirty(); hc.getPoint(cu, tv3); head.position.copy(tv3);
    const sf = (t * .45) % 1; shock.scale.setScalar(1 + sf * 8); shock.material.opacity = (1 - sf) * .85;
    for (let i = 0; i < NA; i++) { const q = ad[i]; amb.setP(i, q[0], -7 + ((q[2] + t * q[3]) % 1) * 16, q[1]); }
    amb.dirty();
    g.rotation.y = t * .15;
  };
});

/* ---------- Global: starfield + the storyline particle stream ---------- */
const STARS = 7500, stars = makePoints(STARS, 2.4, DARK ? .85 : .75), white = new THREE.Color(1, 1, 1);
for (let i = 0; i < STARS; i++) { stars.setP(i, rand(-260, 260), rand(-140, 140), rand(-900, 140)); stars.setC(i, Math.random() < .8 ? (DARK ? white : C.soft) : pick(MS4)); }
stars.dirty(); scene.add(stars);
const curve = new THREE.CatmullRomCurve3(POS.map(p => p.clone().add(new THREE.Vector3(0, -7, 0))), false, 'catmullrom', .5);
const SAMP = 1600, samp = curve.getSpacedPoints(SAMP);
scene.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(samp), new THREE.LineBasicMaterial({ color: C.soft, transparent: true, opacity: DARK ? .25 : .35 })));
const SC = [C.brand, C.brand, C.b, C.y, C.g, C.r, C.b, C.y, C.r, C.g, C.y], NS = 3000, flow = makePoints(NS, 1.6, DARK ? .95 : .9), fd = [], tcol = new THREE.Color();
for (let i = 0; i < NS; i++) fd.push([Math.random(), rand(-1.4, 1.4), rand(-1.4, 1.4), rand(-1.4, 1.4), rand(.004, .011)]);
scene.add(flow);
function updateFlow(t) {
  const ca = flow.geometry.attributes.aColor;
  for (let i = 0; i < NS; i++) {
    const q = fd[i], u = (q[0] + t * q[4]) % 1, f = u * SAMP, j = f | 0, fr = f - j, a = samp[j], b = samp[Math.min(SAMP, j + 1)];
    flow.setP(i, a.x + (b.x - a.x) * fr + q[1], a.y + (b.y - a.y) * fr + q[2] + Math.sin(t * 1.5 + q[0] * 50) * .3, a.z + (b.z - a.z) * fr + q[3]);
    const si = u * (SC.length - 1), s0 = si | 0; tcol.copy(SC[s0]).lerp(SC[Math.min(SC.length - 1, s0 + 1)], si - s0); flow.setC(i, tcol);
  }
  flow.dirty(); ca.needsUpdate = true;
}

/* ---------- Camera choreography ---------- */
const mouse = { x: 0, y: 0 };
addEventListener('pointermove', (e) => { mouse.x = e.clientX / innerWidth * 2 - 1; mouse.y = e.clientY / innerHeight * 2 - 1; }, { passive: true });
const camLook = new THREE.Vector3(0, 0, -40), baseP = new THREE.Vector3(), baseL = new THREE.Vector3(), tv = new THREE.Vector3(), tl = new THREE.Vector3();
let curIdx = clamp(window.__storyIndex | 0, 0, S.length - 1);
const fP = [], fL = [];
function frameFor(i) {
  const narrow = innerWidth <= 900, dist = narrow ? 30 : 24;
  const halfW = Math.tan(THREE.MathUtils.degToRad(24)) * dist * cam.aspect;
  const offX = narrow ? 0 : halfW * .52;
  baseL.copy(POS[i]).sub(tv.set(offX, narrow ? -4 : 0, 0));
  baseP.copy(baseL).add(tv.set(0, 1.6, dist));
}
function frames() { for (let i = 0; i < S.length; i++) { frameFor(i); fP[i] = baseP.clone(); fL[i] = baseL.clone(); } }
frames();
/* The UI publishes window.__cam = { F, orb }: F is a float station index driven by scroll, orb[i] is the pinned-title progress used to orbit station i. */
const ORB = REDUCED ? 0 : .6, sOrb = S.map(() => 0), sm = { x: 0, y: 0 };
const P0 = new THREE.Vector3(), P1 = new THREE.Vector3(), wantP = new THREE.Vector3(), wantL = new THREE.Vector3();
const START_P = new THREE.Vector3(0, 20, 90), START_L = new THREE.Vector3(0, 0, -40);
function orbit(v, c, a) { const x = v.x - c.x, z = v.z - c.z, cs = Math.cos(a), sn = Math.sin(a); v.x = c.x + x * cs + z * sn; v.z = c.z - x * sn + z * cs; return v; }
function camAt(F) {
  const n = S.length - 1, i0 = clamp(Math.floor(F), 0, n), i1 = Math.min(n, i0 + 1), e = easeInOutCubic(clamp(F - i0, 0, 1));
  orbit(P0.copy(fP[i0]), fL[i0], (sOrb[i0] - .5) * ORB);
  orbit(P1.copy(fP[i1]), fL[i1], (sOrb[i1] - .5) * ORB);
  wantP.lerpVectors(P0, P1, e); wantL.lerpVectors(fL[i0], fL[i1], e);
  const arc = Math.sin(Math.PI * e);
  wantP.y += arc * 14; wantP.z += arc * 10;
  return arc;
}
addEventListener('story:goto', (e) => {
  const i = clamp(e.detail.index | 0, 0, S.length - 1);
  if (i !== curIdx) { curIdx = i; if (S[i].arrive) S[i].arrive(.5); }
});
addEventListener('resize', () => {
  renderer.setSize(innerWidth, innerHeight, false); cam.aspect = innerWidth / innerHeight; cam.updateProjectionMatrix();
  frames();
});

/* ---------- Loop ---------- */
let last = performance.now(), sF = -1, boot = REDUCED ? 1 : 0;
if (S[curIdx].arrive) S[curIdx].arrive(REDUCED ? .3 : 1.9);
function loop(now) {
  requestAnimationFrame(loop);
  const dt = Math.min((now - last) / 1000, .05); last = now; T += dt; uTime.value = T;
  const ck = window.__cam || { F: curIdx, orb: [] };
  const tF = REDUCED ? curIdx : clamp(+ck.F || 0, 0, S.length - 1);
  const k = 1 - Math.pow(.003, dt);
  sF = sF < 0 ? tF : sF + (tF - sF) * k;
  for (let i = 0; i < S.length; i++) sOrb[i] += (((ck.orb && ck.orb[i]) || 0) - sOrb[i]) * k;
  let arc = camAt(sF);
  const m = REDUCED ? 0 : 1, km = 1 - Math.pow(.02, dt);
  sm.x += (mouse.x - sm.x) * km; sm.y += (mouse.y - sm.y) * km;
  wantP.x += sm.x * 1.6 * m; wantP.y += (-sm.y * 1.0 + Math.sin(T * .5) * .35) * m;
  wantL.x += sm.x * .6 * m; wantL.y += -sm.y * .4 * m;
  if (boot < 1) {
    boot = Math.min(1, boot + dt / 3.2);
    const e = easeInOutCubic(boot), b = Math.sin(Math.PI * e);
    wantP.lerpVectors(START_P, wantP, e); wantP.y += b * 14;
    wantL.lerpVectors(START_L, wantL, e);
    arc = Math.max(arc, b);
  }
  cam.position.copy(wantP); camLook.copy(wantL);
  const fovT = 48 + (REDUCED ? 0 : 12 * arc);
  if (Math.abs(cam.fov - fovT) > .01) { cam.fov = fovT; cam.updateProjectionMatrix(); }
  cam.lookAt(camLook);
  for (const s of S) { const near = s.pos.distanceTo(cam.position) < 170; s.g.visible = near; if (near) s.update(T, dt); }
  updateFlow(T);
  renderer.render(scene, cam);
}
requestAnimationFrame((n) => { last = n; loop(n); });
document.body.classList.remove('no-gl');
} catch (err) {
  console.warn('3D storyboard disabled:', err);
  document.body.classList.add('no-gl');
}
</script>
